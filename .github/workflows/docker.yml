name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Application Smoke Test
        run: |
          mkdir -p logs qr_codes
          python main.py --url http://github.com/djnv34
          echo "✅ Application ran successfully"
          ls -la qr_codes/

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/qr-code-generator-app:latest
            ${{ secrets.DOCKER_USERNAME }}/qr-code-generator-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Docker Image
        run: |
          docker pull ${{ secrets.DOCKER_USERNAME }}/qr-code-generator-app:latest
          docker run --rm \
            -v ${{ github.workspace }}/qr_codes:/app/qr_codes \
            ${{ secrets.DOCKER_USERNAME }}/qr-code-generator-app:latest \
            --url http://github.com/kaw393939
          echo "✅ Docker image verified successfully"